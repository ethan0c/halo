<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' https://huggingface.co https://*.huggingface.co https://*.hf.co blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:;" />
  <title>Halo</title>
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div id="app">
    <header class="bar" id="bar">
      <div class="logo" id="logo" title="Halo"></div>

      <button id="btn-capture" class="chip" title="Capture the screen and ask Claude (⌘⇧↩)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.2"/></svg>
        <span>Capture</span><kbd>⌘⇧↩</kbd>
      </button>

      <button id="btn-listen" class="chip" title="Interview mode: listen, transcribe, suggest answers (⌘⇧L)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <span>Listen</span><kbd>⌘⇧L</kbd>
      </button>

      <form id="ask-form" class="ask" autocomplete="off">
        <input id="ask-input" type="text" placeholder="Ask about your screen…" spellcheck="false" />
      </form>

      <label class="toggle icon" id="attach-label" title="Attach a fresh screenshot with each question">
        <input type="checkbox" id="attach-screen" checked />
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="13" rx="2"/><path d="M8 21h8"/></svg>
      </label>

      <button id="btn-settings" class="icon" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <button id="btn-hide" class="icon" title="Hide (Esc). Bring back with ⌘⇧Space">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>
      </button>
    </header>

    <section id="panel" class="panel hidden">
      <div id="transcript" class="transcript hidden"></div>
      <div id="answer" class="answer"></div>
      <footer class="panel-foot">
        <span id="status" class="status"></span>
        <span class="spacer"></span>
        <button id="btn-stop" class="mini hidden">Stop</button>
        <button id="btn-answer-now" class="mini hidden">Answer now</button>
        <button id="btn-copy" class="mini">Copy</button>
        <button id="btn-clear" class="mini">New</button>
      </footer>
    </section>

    <section id="settings" class="panel settings hidden">
      <div class="settings-head">
        <div class="settings-title"><span class="logo small" id="logo-2"></span><strong>Halo</strong><span class="muted">settings</span></div>
        <button id="btn-close-settings" class="icon" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <p id="settings-hint" class="hint hidden"></p>

      <div class="field">
        <label for="api-key">Anthropic API key</label>
        <div class="row">
          <input id="api-key" type="password" placeholder="sk-ant-…" spellcheck="false" />
          <button id="btn-save-key" class="mini primary">Save</button>
        </div>
        <small id="key-status" class="muted"></small>
      </div>

      <div class="grid">
        <div class="field">
          <label for="model">Model</label>
          <select id="model">
            <option value="claude-opus-5-5">Claude Opus 5.5 (default)</option>
            <option value="claude-sonnet-5-5">Claude Sonnet 5.5 (faster)</option>
            <option value="claude-haiku-4-5">Claude Haiku 4.5 (fastest)</option>
            <option value="claude-fable-5-1">Claude Fable 5.1 (most capable)</option>
          </select>
        </div>
        <div class="field">
          <label for="effort">Depth for screen questions</label>
          <select id="effort">
            <option value="low">Fast</option>
            <option value="medium">Balanced</option>
            <option value="high">Deep</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="context">About you <span class="muted">(resume, role, the job you're interviewing for)</span></label>
        <textarea id="context" rows="4" placeholder="e.g. Senior frontend engineer, 6 yrs React/TypeScript, led migration to Next.js at Acme; interviewing for Staff role at…"></textarea>
      </div>

      <div class="grid">
        <div class="field">
          <label for="mic">Microphone / input</label>
          <select id="mic"><option value="">System default</option></select>
          <small class="muted">To hear the interviewer, use speakers or pick a loopback device (e.g. BlackHole).</small>
        </div>
        <div class="field">
          <label for="whisper-model">Speech model (runs locally)</label>
          <select id="whisper-model">
            <option value="onnx-community/whisper-tiny">Whisper tiny (fastest)</option>
            <option value="onnx-community/whisper-base">Whisper base (balanced)</option>
            <option value="onnx-community/whisper-small">Whisper small (most accurate)</option>
          </select>
        </div>
      </div>

      <div class="row checks">
        <label class="check"><input type="checkbox" id="auto-answer" /> Auto-suggest answers while listening</label>
        <label class="check" id="system-audio-label"><input type="checkbox" id="system-audio" /> Also capture system audio</label>
      </div>

      <div class="row shortcuts">
        <span><kbd>⌘⇧Space</kbd> show / hide</span>
        <span><kbd>⌘⇧↩</kbd> capture</span>
        <span><kbd>⌘⇧L</kbd> listen</span>
        <span><kbd>Esc</kbd> hide</span>
        <span class="spacer"></span>
        <button id="btn-quit" class="mini danger">Quit Halo</button>
      </div>
    </section>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
